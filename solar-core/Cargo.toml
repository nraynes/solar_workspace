[package]
name = "solar-core"
version = "1.0.1"
edition = "2024"
authors = ["Nicholas Raynes"]
description = "Core library for cargo-solar command."
license  = "MIT OR Apache-2.0"
readme = "../README.md"
repository = "https://github.com/nraynes/solar_workspace"
keywords = ["solar", "framework", "cargo", "project", "tools"]
categories = ["command-line-utilities", "development-tools"]
include = [
    "src/",
    "examples/",
    "Cargo.toml",
    "../LICENSES/",
    "../LICENSE",
    "../README.md",
    "../CHANGELOG.md",
]

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
derive-getters = "0.5.0"
derive_setters = "0.1.9"
reqwest = { version = "0.13.4", features = ["blocking"] }
rust-alert = "0.3.0"
rust-dl = "0.0.1"
rust-terminal = "0.2.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
spdx = "0.13.4"
toml = "1.1.2"
url = "2.5.8"
