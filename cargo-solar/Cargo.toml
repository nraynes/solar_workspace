[package]
name = "cargo-solar"
version = "1.0.5"
edition = "2024"
authors = ["Nicholas Raynes"]
description = "Cargo tool for automating use of the solar framework used for building rust projects."
license  = "MIT OR Apache-2.0"
readme = "../README.md"
repository = "https://github.com/nraynes/solar_workspace"
keywords = ["solar", "framework", "cargo", "project", "tools"]
categories = ["command-line-utilities", "development-tools"]
include = [
    "src/",
    "examples/",
    "Cargo.toml",
    "../LICENSES/",
    "../LICENSE",
    "../README.md",
    "../CHANGELOG.md",
    "build.rs",
]

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
serde_json = "1.0.150"
solar-core = { version = "1.0.5", path = "../solar-core" }

[build-dependencies]
clap = { version = "4.6.1", features = ["derive"] }
clap_mangen = "0.3.0"
solar-core = { version = "1.0.5", path = "../solar-core" }

[[bin]]
name = "cargo-solar"
path = "src/main.rs"

[dev-dependencies]
affirm-fs = "0.5.7"
derive-getters = "0.5.0"
mocked-up = "0.6.5"
rust-terminal = "0.3.0"
toml = "1.1.2"
